name: Update SVG profile cards
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'generate_cards.py'
      - 'profile.json'
      - 'fonts/**'
      - '.github/workflows/update-cards.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font and font subsetting dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato
          pip install 'fonttools[woff]>=4.50,<5'
      - name: Download contributions (GitHub GraphQL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import datetime, json, os, urllib.request
          today = datetime.date.today()
          start = today - datetime.timedelta(days=365)
          query = '''query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) { contributionsCollection(from:$from,to:$to) {
              contributionCalendar { weeks { contributionDays { date contributionCount } } }
            } }
          }'''
          body = json.dumps({'query':query,'variables':{'login':'krishz005','from':start.isoformat()+'T00:00:00Z','to':today.isoformat()+'T23:59:59Z'}}).encode()
          req = urllib.request.Request('https://api.github.com/graphql',data=body,
             headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','User-Agent':'svg-profile-builder'})
          with urllib.request.urlopen(req,timeout=25) as response:
              result = json.load(response)
          if result.get('errors') or not result.get('data',{}).get('user'):
              raise SystemExit('GraphQL error: '+repr(result.get('errors','no user')))
          weeks = result['data']['user']['contributionsCollection']['contributionCalendar']['weeks']
          days = [{'date':d['date'],'count':d['contributionCount']} for w in weeks for d in w['contributionDays']]
          os.makedirs('data',exist_ok=True)
          with open('data/contributions.json','w') as f: json.dump({'days':days},f,indent=2)
          PY
      - name: Render animated SVGs
        run: python generate_cards.py
      - name: Commit refreshed cards and contribution data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/ data/contributions.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh SVG profile cards [skip ci]'
            git push
          fi
